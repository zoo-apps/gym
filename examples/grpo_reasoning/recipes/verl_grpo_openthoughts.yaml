# verl (Ray GRPO) Production Training Recipe (HIP-1350 / zoo-apps/gym#7)
# License: Apache-2.0
# Maintained Trainer: volcengine/verl (Ray GRPO with Schulman k3 low_var_kl)
# Note: Open-R1 is an archived historical reference only and is NOT used here.
# Separate human license review is required for base model weights and
# OpenThoughts traces before production redistribution (see LICENSE_AUDIT.json).

recipe_metadata:
  hip: HIP-1350
  issue: zoo-apps/gym#7
  trainer_framework: volcengine/verl
  recipe_license: Apache-2.0
  base_model_license: Apache-2.0
  dataset_license: Apache-2.0
  separate_license_review_required: true

algorithm:
  adv_estimator: grpo
  use_kl_in_reward: false
  norm_adv_by_std_in_grpo: true

data:
  dataset_id: open-thoughts/OpenThoughts-114k
  dataset_revision: main
  train_files: ./data/openthoughts_verifiable_train.parquet
  val_files: ./data/independent_held_out_eval.parquet
  train_batch_size: 64
  max_prompt_length: 1024
  max_response_length: 1024
  filter_overlong_prompts: true
  truncation: error

actor_rollout_ref:
  model:
    path: Qwen/Qwen2.5-1.5B-Instruct
    revision: 989aa7980e4cf806f80c7fef2b1adb7bc71aa306
    use_remove_padding: true
    enable_gradient_checkpointing: true
  actor:
    optim_lr: 5e-6
    ppo_mini_batch_size: 32
    ppo_micro_batch_size_per_gpu: 4
    ppo_epochs: 2
    clip_ratio: 0.2
    use_kl_loss: true
    kl_loss_coef: 0.04
    kl_loss_type: low_var_kl
    entropy_coeff: 0.0
  rollout:
    name: vllm
    n: 8
    temperature: 0.8
    top_p: 0.95
    tensor_model_parallel_size: 1
    gpu_memory_utilization: 0.6

custom_reward_function:
  path: examples/grpo_reasoning/rewards.py
  name: verl_compute_score
  verifier_version: hip1350-verifier-v1.0.0

independent_held_out_eval:
  dataset_path: examples/grpo_reasoning/dataset.py
  verifier_module: examples.grpo_reasoning.rewards
  eval_seed: 1350
  require_zero_leakage_check: true

trainer:
  project_name: zoo-gym-hip1350-grpo
  experiment_name: qwen25-1.5b-openthoughts-grpo-g8
  total_epochs: 1
  n_gpus_per_node: 4
  nnodes: 1
  save_freq: 100
  test_freq: 25
  seed: 1350
